name: Release Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-source:
    runs-on: ubuntu-latest
    steps:
    - name: Require the protected release branch
      env:
        RELEASE_REF: ${{ github.ref }}
      run: test "$RELEASE_REF" = refs/heads/master

  ios-wda:
    needs: release-source
    uses: ./.github/workflows/ios-wda-artifact.yml

  windows-release:
    needs: [release-source, ios-wda]
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      EXPECTED_ARCH: x64
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22'
        cache: npm
    - name: Verify runner architecture
      run: node -e "require('node:assert/strict').equal(process.arch, process.env.EXPECTED_ARCH)"
    - name: Install dependencies
      run: npm ci --no-audit --no-fund
    - name: Download Windows device resources
      run: npx --no-install zx --shell "C:/Program Files/Git/bin/bash.exe" script/resources.mjs
    - name: Prepare source backend toolchain
      uses: ./.github/actions/platform-toolchain
    - uses: ./.github/actions/ios-toolchain
    - name: Build distribution
      run: npm run build
    - name: Package installer
      run: npm run pack -- --no-publish
    - name: Install and smoke test Windows release artifact
      timeout-minutes: 5
      run: ./script/check-windows-install.ps1
    - name: Record Windows signature and hash
      shell: pwsh
      run: |
        $pkg = Get-Content package.json -Raw | ConvertFrom-Json
        $release = Join-Path release $pkg.version
        $installer = Join-Path $release "$($pkg.productName)-$($pkg.version)-win-x64.exe"
        $signature = Get-AuthenticodeSignature -LiteralPath $installer
        @{
          sourceCommit = $env:GITHUB_SHA
          runUrl = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          installer = Split-Path $installer -Leaf
          sha256 = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          authenticodeStatus = [string]$signature.Status
          signer = $signature.SignerCertificate.Subject
          installationAndStartup = 'passed'
        } | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $release 'verification-win-x64.json')
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: windows-release-x64
        if-no-files-found: error
        path: |
          release/*/*.exe
          release/*/*.yml
          release/*/*.blockmap
          release/*/verification-*.json
          !release/**/win-unpacked/
          !release/**/builder-debug.yml

  macos-release:
    needs: [release-source, ios-wda]
    runs-on: macos-15
    timeout-minutes: 120
    environment: macos-release
    env:
      EXPECTED_ARCH: arm64
      APPLE_KEYCHAIN_PROFILE: pipeline-release
    steps:
    - name: Check release credentials
      shell: bash
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        CSC_LINK: ${{ secrets.CSC_LINK }}
        CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      run: |
        for name in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID CSC_LINK CSC_KEY_PASSWORD; do
          if [[ -z "${!name}" ]]; then
            echo "::error::Missing macos-release secret: $name"
            exit 1
          fi
        done
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22'
        cache: npm
    - name: Verify runner architecture
      run: node -e "require('node:assert/strict').equal(process.arch, process.env.EXPECTED_ARCH)"
    - name: Install dependencies
      run: npm ci --no-audit --no-fund
    - name: Download macOS device resources
      run: npm run init
    - name: Prepare source backend toolchain
      uses: ./.github/actions/platform-toolchain
    - uses: ./.github/actions/ios-toolchain
    - name: Build distribution
      run: npm run build
    - name: Prepare temporary notarization keychain
      shell: bash
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        export APPLE_KEYCHAIN="$RUNNER_TEMP/scrcpy-plus-notary.keychain-db"
        echo "APPLE_KEYCHAIN=$APPLE_KEYCHAIN" >> "$GITHUB_ENV"
        keychain_password=$(openssl rand -hex 32)
        security create-keychain -p "$keychain_password" "$APPLE_KEYCHAIN"
        security set-keychain-settings -lut 7200 "$APPLE_KEYCHAIN"
        security unlock-keychain -p "$keychain_password" "$APPLE_KEYCHAIN"
        xcrun notarytool store-credentials "$APPLE_KEYCHAIN_PROFILE" \
          --keychain "$APPLE_KEYCHAIN" --apple-id "$APPLE_ID" \
          --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID"
    - name: Sign and notarize app and DMG
      timeout-minutes: 100
      run: npm run pack -- --no-publish --release
      env:
        CSC_LINK: ${{ secrets.CSC_LINK }}
        CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    - name: Verify and package standalone CLI and MCP client
      shell: bash
      run: |
        npm run check:automation-package
        version=$(node -p 'require("./package.json").version')
        mkdir -p "release/$version"
        npm pack ./dist/cli --pack-destination "release/$version"
        test -s "release/$version/scrcpy-plus-cli-$version.tgz"
    - name: Verify trust, update metadata and installed app startup
      timeout-minutes: 10
      run: node script/check-macos-install.mjs --release
      env:
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: macos-release-arm64
        if-no-files-found: error
        path: |
          release/*/*.dmg
          release/*/*.yml
          release/*/*.blockmap
          release/*/*.tgz
          release/*/verification-*.json
          !release/**/builder-debug.yml
    - name: Remove temporary notarization keychain
      if: always()
      shell: bash
      run: |
        if [[ -n "${APPLE_KEYCHAIN:-}" && -f "$APPLE_KEYCHAIN" ]]; then
          security delete-keychain "$APPLE_KEYCHAIN"
        fi
