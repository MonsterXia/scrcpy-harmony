name: Dev.2 release operations
on:
  workflow_dispatch:
    inputs:
      acceptance_run:
        description: Successful preflight run on this exact operations commit
        required: true
        type: string
      resume_run:
        description: Prior operations run to restore fixed release ID after interruption
        required: false
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: scrcpy-plus-v1.0.5-dev.2-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      DEV2_OPERATIONS_SHA: ${{ github.sha }}
      DEV2_ACCEPTANCE_RUN: ${{ inputs.acceptance_run }}
      DEV2_RESUME_RUN: ${{ inputs.resume_run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify operation safety
        run: |
          python -B -m unittest discover -s script/dev-release -p 'test_*.py'
          node --test script/dev-release/test-*.cjs
      - name: Prepare, verify all uploaded bytes and publish fixed prerelease
        timeout-minutes: 30
        run: python -B script/dev-release/operate.py
      - name: Preserve audit and fixed release state
        if: ${{ always() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: dev2-publication-audit
          if-no-files-found: warn
          path: |
            release/dev2-1.0.5-audit/*.json
            release/dev2-1.0.5-audit/verified-assets/release-validation.json
            release/dev2-1.0.5-audit/verified-assets/SHA256SUMS.txt
