name: Packaged update acceptance
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify candidate before publication or published dev.2
        required: true
        type: choice
        options: [preflight, postrelease]
        default: preflight
permissions:
  contents: read
  actions: read
jobs:
  update:
    name: acceptance-${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: macos-15
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_PLATFORM: ${{ matrix.platform }}
      EXPECTED_ARCH: ${{ matrix.arch }}
      RELEASE_MODE: ${{ inputs.mode }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install acceptance driver dependencies
        run: npm ci --no-audit --no-fund
      - name: Check operation safety regressions
        run: |
          python -B -m unittest discover -s script/dev-release -p 'test_*.py'
          node --test script/dev-release/test-*.cjs
      - name: Install genuine binaries and verify default profiles and update paths
        run: python -B script/dev-release/run-matrix.py
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: dev2-${{ inputs.mode }}-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/dev2-acceptance/summary.json
            release/dev2-acceptance/[0-9][0-9]-*/report.json
            release/dev2-acceptance/[0-9][0-9]-*/installer.json
            release/dev2-acceptance/[0-9][0-9]-*/profile-preservation.json
            release/dev2-acceptance/[0-9][0-9]-*/*.png
