name: Unsigned iOS Runner
on:
  workflow_call:
permissions:
  contents: read
jobs:
  wda:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Build pinned unsigned WDA
        shell: bash
        run: node script/ios-wda.mjs build --unsigned --xcode "$(xcode-select -p)"
      - name: Prepare clean sideload input
        run: python3 native/ios-device/package_wda.py build/ios-wda/unsigned/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app build/ios-wda/WDA.ipa
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-wda
          path: build/ios-wda/WDA.ipa
          if-no-files-found: error
          retention-days: 7
