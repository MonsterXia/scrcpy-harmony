name: iOS provisioning toolchain
description: Build self-contained signing and USB helpers, consuming the unsigned Runner from this workflow
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.13'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: unsigned-wda
        path: build/ios-wda-input
    - name: Prepare Rust and build inputs
      shell: bash
      run: |
        rustup toolchain install 1.95.0 --profile minimal
        rustup override set 1.95.0
        echo "IOS_WDA_IPA=$GITHUB_WORKSPACE/build/ios-wda-input/WDA.ipa" >> "$GITHUB_ENV"
        echo "IOS_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
    - name: Build iOS helpers with the host compiler
      shell: bash
      run: |
        # platform-toolchain exports MinGW for AirPlay. Cargo's Windows host is
        # MSVC; keep that compiler selection local to this helper build. The
        # distribution build reuses these validated resources, then builds
        # AirPlay with its original MinGW environment.
        if [[ "$RUNNER_OS" == "Windows" ]]; then unset CC CXX; fi
        npm run build:ios
