[package]
name = "scrcpy-plus-ios-sign"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0"

[dependencies]
isideload = { git = "https://github.com/nab138/isideload", rev = "326e56229d0727cb6e7b34c8cf03e37e2cd3e17d" }
idevice = { version = "=0.1.68", features = ["usbmuxd", "installation_proxy", "afc"] }
tokio = { version = "1.49", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native"] }
rootcause = "0.12"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
zeroize = "1"

[profile.release]
strip = true
